server {
    listen 80;
    server_name 150-241-64-249.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/public;
    }
}

server {
    listen 3456 ssl;
    server_name 150-241-64-249.sslip.io;

    root /var/www/public;

     # Пути к сертификатам, которые сгенерирует Certbot
    ssl_certificate /etc/letsencrypt/live/150-241-64-249.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/150-241-64-249.sslip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        try_files $uri $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param HTTPS on;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        fastcgi_connect_timeout 1000s;
        fastcgi_send_timeout 1000s;
        fastcgi_read_timeout 1000s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 4 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
    }

}
