services:
  nginx:
    image: nginx:latest
    volumes:
      - ./:/var/www/
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/
    ports:
      - "${NGINX_PORT}:80"
    depends_on:
      - app
    container_name: payment_system_nginx
  app:
    image: php-nodejs
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    volumes:
      - ./:/var/www/
    container_name: payment_system_app
    depends_on:
      - db
    ports:
      - "5173:5173"
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
        - ./tmp/db:/var/lib/postgresql/18/docker
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command:
      - "postgres"
      - "-c"
      - 'port=${DB_PORT}'
    container_name: payment_system_db
  supervisor_worker:
    image: php-nodejs
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    restart: always
    volumes:
      - .:/var/www
    depends_on:
      - db
    command: [ "/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf" ]
    container_name: payment_system_supervisor_worker
  redis:
    image: redis:alpine
    container_name: payment_system_redis
    restart: unless-stopped
    ports:
        - "${REDIS_PORT}:${REDIS_PORT}"
    # command: redis-server --requirepass "ваш_пароль" # опционально для пароля
    volumes:
        - ./redis-data:/data
