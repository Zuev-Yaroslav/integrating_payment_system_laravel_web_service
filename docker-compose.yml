services:
  nginx:
    image: nginx:latest
    volumes:
      - ./:/var/www/
      - ./_docker/nginx/conf.d/:/etc/nginx/conf.d/
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "${NGINX_PORT}:${NGINX_PORT}"
      - "80:80"
    depends_on:
      - app
    container_name: payment_system_nginx
    networks:
      - payment_network

  app:
    image: php-nodejs
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    volumes:
      - ./:/var/www/
    container_name: payment_system_app
    depends_on:
      - db
      - redis
    ports:
      - "5173:5173"
    networks:
      - payment_network

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
        - ./tmp/db:/var/lib/postgresql/18/docker
    ports:
      - "${DB_PORT}:${DB_PORT}"
    command:
      - "postgres"
      - "-c"
      - 'port=${DB_PORT}'
    container_name: payment_system_db
    networks:
      - payment_network

  supervisor_worker:
    image: php-nodejs
    build:
      context: .
      dockerfile: _docker/app/Dockerfile
    restart: always
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    command: [ "/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf" ]
    container_name: payment_system_supervisor_worker
    networks:
      - payment_network

  redis:
    image: redis:8.10-alpine
    container_name: payment_system_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT}:6379"
    volumes:
      - payment_redis_data:/data
    networks:
      payment_network:
        aliases:
          - payment_system_redis

volumes:
  payment_redis_data:
    driver: local

networks:
  payment_network:
    driver: bridge
